<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAZAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config/supabase.config.js"></script>
<style>
:root{
  --bg:#FFFFFF; --bg-alt:#F7F8FA; --ink:#111318; --ink-soft:#5A6072;
  --brand:#2954E8; --brand-ink:#FFFFFF; --brand-soft:#EAF0FF;
  --ok:#0FA968; --ok-soft:#E7F9F1; --danger:#E5433F; --line:#E7E9EF; --star:#F5A623;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;font-size:15px;}
.wrap{max-width:1180px;margin:0 auto;padding-inline:18px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
header{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:800;font-size:21px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-block:24px;}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);}}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;}
.card-img{aspect-ratio:1/1;background:var(--bg-alt);}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:10px 12px 14px;}
.card h3{font-size:13px;margin:0 0 6px;}
.price{font-weight:800;color:var(--brand);}
.price s{color:var(--ink-soft);font-weight:400;font-size:12px;margin-right:6px;}
.hero-video{width:100%;aspect-ratio:16/7;background:var(--bg-alt);border-radius:12px;overflow:hidden;margin-block:20px;}
.hero-video video,.hero-video img{width:100%;height:100%;object-fit:cover;}
.btn{background:var(--brand);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;}
.loading{padding:60px;text-align:center;color:var(--ink-soft);}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:12px;color:var(--ink-soft);}
</style>
</head>
<body>
<header class="wrap">
  <span class="logo" id="storeNameLabel">BAZAA</span>
  <a href="/admin.html">Admin</a>
</header>

<div class="wrap">
  <div class="hero-video" id="heroVideoWrap"></div>
  <div id="productGrid" class="grid"><div class="loading">Yüklənir...</div></div>
</div>

<footer>© <span id="year"></span> BAZAA</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const supabase = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

function money(n){ return Number(n).toFixed(2).replace(/\.00$/,'') + ' ₼'; }

async function trackPageView(){
  try{ await supabase.from('page_views').insert({ path: location.pathname }); }catch(e){}
}

async function loadSettings(){
  const { data } = await supabase.from('site_settings').select('*').single();
  if(!data) return;
  document.getElementById('storeNameLabel').textContent = data.store_name || 'BAZAA';
  document.title = data.store_name || 'BAZAA';
  const wrap = document.getElementById('heroVideoWrap');
  if(data.hero_video_url){
    wrap.innerHTML = `<video src="${data.hero_video_url}" autoplay muted loop playsinline></video>`;
  } else {
    wrap.remove();
  }
}

async function loadProducts(){
  const { data, error } = await supabase.from('products').select('*').eq('is_active', true).order('created_at', { ascending:false });
  const grid = document.getElementById('productGrid');
  if(error || !data || data.length===0){
    grid.innerHTML = '<div class="loading">Hazırda məhsul yoxdur. Admin paneldən əlavə edin.</div>';
    return;
  }
  grid.innerHTML = data.map(p => `
    <div class="card" onclick="location.href='/product.html?id=${p.id}'">
      <div class="card-img"><img src="${p.image_url||'https://placehold.co/400x400/eee/999?text=Şəkil'}" loading="lazy"></div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="price">${p.sale_price>0?`<s>${money(p.price)}</s>${money(p.sale_price)}`:money(p.price)}</div>
      </div>
    </div>`).join('');
}

trackPageView();
loadSettings();
loadProducts();
</script>
</body>
</html>
